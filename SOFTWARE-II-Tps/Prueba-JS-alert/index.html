<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba JS</title>
</head>
<body>
    <script>
        let nombre = prompt("Ingresa tu Nombre: ");
        let edad = prompt("Ingresa tu Edad");
        let dni = Number(prompt("Ingresa tu DNI: "));
        let ciudad = prompt("Ingresa Ciudad");

        alert(`Tu nombre es: ${nombre}, tu edad: ${edad}, tu DNI es: ${dni}, y tu ciudad: ${ciudad}`);

    </script>
</body>
</html>
